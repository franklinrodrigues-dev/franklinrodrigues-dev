<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 231" width="830" height="231" role="img" aria-label="Sobre Franklin Rodrigues">
<rect x="0" y="0" width="830" height="231" rx="0" fill="#FBFAF3"/>
<rect x="0.5" y="0.5" width="829" height="230" rx="0" fill="none" stroke="#D5D5C7" stroke-width="1"/>
<text x="23" y="29" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="750" fill="#20231F" letter-spacing="1.2">SOBRE MIM</text>
<text x="807" y="29" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="10" font-weight="650" fill="#838579" letter-spacing="0.5" text-anchor="end">DESENVOLVIMENTO DE SOFTWARE</text>
<path d="M0 46L830 46" stroke="#D5D5C7" fill="none"/>
<text x="27" y="86" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="850" fill="#20231F" letter-spacing="0">Tecnologia, aprendizado e construção contínua.</text>
<text x="27" y="118" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="450" fill="#66695E" letter-spacing="0">Estou construindo minha trajetória no desenvolvimento Full Stack, com interesse em aplicações web,</text>
<text x="27" y="142" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="450" fill="#66695E" letter-spacing="0">interfaces funcionais, APIs e soluções que resolvam problemas reais.</text>
<text x="27" y="175" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="450" fill="#66695E" letter-spacing="0">Meu foco é aprender na prática, transformar conhecimento em projetos e evoluir continuamente como</text>
<text x="27" y="199" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13.5" font-weight="450" fill="#66695E" letter-spacing="0">desenvolvedor.</text>
</svg>